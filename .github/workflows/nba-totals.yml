# NBA totals watcher.
#
# GitHub cron is UTC, best-effort, and often late. Each job is killed at 6 hours.
# Slots cover the slate, two short parlay boards, the evening, and the late
# night. Each is scheduled at both the EDT and EST offsets. watcher.py exits
# immediately when the America/New_York clock is outside that slot's window,
# so the off-by-one-hour cron does not poll or spend an Odds API credit.
# Parlay boards are one pass and are killed after 4 minutes so they release
# the concurrency group before the evening watcher needs it.
#
# A second cron later in the same ET hour is a safety net when the first fire is
# dropped. Concurrency keeps a single watcher running; a newer waiting run
# replaces an older waiting run, and the in-progress run is left alone.
#
# There is no `push` trigger. Commits to the `state` branch do not start a run.
# (GITHUB_TOKEN pushes do not start workflows either.)

name: NBA totals watcher

on:
  schedule:
    # Early parlay board — 11:08 AM and 11:28 AM ET. 11:05 EST is 16:05 UTC,
    # which is already the noon slate's EDT cron, so this slot uses :08 and :28.
    - cron: '8 15 * * *'    # 11:08 AM EDT
    - cron: '28 15 * * *'   # 11:28 AM EDT
    - cron: '8 16 * * *'    # 11:08 AM EST
    - cron: '28 16 * * *'   # 11:28 AM EST
    # Slate — 12:05 PM and 12:30 PM ET. The card only. Parlays are the slots above and below.
    - cron: '5 16 * * *'    # 12:05 PM EDT
    - cron: '30 16 * * *'   # 12:30 PM EDT
    - cron: '5 17 * * *'    # 12:05 PM EST
    - cron: '30 17 * * *'   # 12:30 PM EST
    # Final parlay board — 3:30 PM and 3:50 PM ET.
    - cron: '30 19 * * *'   # 3:30 PM EDT
    - cron: '50 19 * * *'   # 3:50 PM EDT
    - cron: '30 20 * * *'   # 3:30 PM EST
    - cron: '50 20 * * *'   # 3:50 PM EST
    # Evening — 5:45 PM and 6:20 PM ET. The slate run has left by 5:30 PM,
    # then this job polls until 11:30 PM (under the 6-hour cap).
    - cron: '45 21 * * *'   # 5:45 PM EDT
    - cron: '20 22 * * *'   # 6:20 PM EDT
    - cron: '45 22 * * *'   # 5:45 PM EST
    - cron: '20 23 * * *'   # 6:20 PM EST
    # Late — 11:20 PM and 11:45 PM ET. Queues behind the evening job, which
    # exits at 11:30 PM, then polls until every game is final or 3:00 AM ET.
    - cron: '20 3 * * *'    # 11:20 PM EDT
    - cron: '45 3 * * *'    # 11:45 PM EDT
    - cron: '20 4 * * *'    # 11:20 PM EST
    - cron: '45 4 * * *'    # 11:45 PM EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run prints Telegram cards and does not post. live posts. check is one scoreboard poll. simulate is offline.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - check
          - simulate
          - live
      follow:
        description: 'Keep polling until the slate ends. Off runs a single pass so a manual dry run does not block the night. Ignored for a parlay board.'
        required: true
        default: false
        type: boolean
      board:
        description: 'Manual parlay board when slot is auto. early or final posts that board and exits. Ignored when slot is a named slot.'
        required: true
        default: none
        type: choice
        options:
          - none
          - early
          - final
      slot:
        description: 'auto keeps mode/follow/board. A named slot matches that cron, including its handoff, with about 45 minutes of late grace.'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - early_board
          - slate
          - final_board
          - evening
          - late

permissions:
  contents: write

concurrency:
  group: nba-totals-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the state-branch push is a normal fast-forward,
          # not a shallow update.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve slot and mode
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FOLLOW: ${{ inputs.follow }}
          INPUT_BOARD: ${{ inputs.board }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=${INPUT_MODE}" >> "$GITHUB_OUTPUT"
            case "${INPUT_SLOT:-auto}" in
              early_board)
                echo "slot=parlay-early" >> "$GITHUB_OUTPUT"
                echo "max_polls=1" >> "$GITHUB_OUTPUT"
                echo "max_runtime=240" >> "$GITHUB_OUTPUT"
                echo "force=" >> "$GITHUB_OUTPUT"
                echo "dispatched=1" >> "$GITHUB_OUTPUT"
                ;;
              final_board)
                echo "slot=parlay-final" >> "$GITHUB_OUTPUT"
                echo "max_polls=1" >> "$GITHUB_OUTPUT"
                echo "max_runtime=240" >> "$GITHUB_OUTPUT"
                echo "force=" >> "$GITHUB_OUTPUT"
                echo "dispatched=1" >> "$GITHUB_OUTPUT"
                ;;
              slate|evening|late)
                echo "slot=${INPUT_SLOT}" >> "$GITHUB_OUTPUT"
                echo "max_polls=" >> "$GITHUB_OUTPUT"
                echo "max_runtime=21000" >> "$GITHUB_OUTPUT"
                echo "force=" >> "$GITHUB_OUTPUT"
                echo "dispatched=1" >> "$GITHUB_OUTPUT"
                ;;
              *)
                # slot=auto. board and follow keep the old manual behavior.
                echo "dispatched=" >> "$GITHUB_OUTPUT"
                if [ "$INPUT_BOARD" = "early" ] || [ "$INPUT_BOARD" = "final" ]; then
                  echo "slot=parlay-${INPUT_BOARD}" >> "$GITHUB_OUTPUT"
                  echo "max_polls=1" >> "$GITHUB_OUTPUT"
                  echo "max_runtime=240" >> "$GITHUB_OUTPUT"
                  echo "force=1" >> "$GITHUB_OUTPUT"
                else
                  echo "slot=manual" >> "$GITHUB_OUTPUT"
                  echo "force=" >> "$GITHUB_OUTPUT"
                  if [ "$INPUT_FOLLOW" = "true" ]; then
                    echo "max_polls=" >> "$GITHUB_OUTPUT"
                  else
                    echo "max_polls=1" >> "$GITHUB_OUTPUT"
                  fi
                  echo "max_runtime=21000" >> "$GITHUB_OUTPUT"
                fi
                ;;
            esac
            exit 0
          fi
          case "$EVENT_SCHEDULE" in
            "8 15 * * *"|"28 15 * * *"|"8 16 * * *"|"28 16 * * *")
              slot=parlay-early ;;
            "5 16 * * *"|"30 16 * * *"|"5 17 * * *"|"30 17 * * *")
              slot=slate ;;
            "30 19 * * *"|"50 19 * * *"|"30 20 * * *"|"50 20 * * *")
              slot=parlay-final ;;
            "45 21 * * *"|"20 22 * * *"|"45 22 * * *"|"20 23 * * *")
              slot=evening ;;
            "20 3 * * *"|"45 3 * * *"|"20 4 * * *"|"45 4 * * *"|\
            "20 03 * * *"|"45 03 * * *"|"20 04 * * *"|"45 04 * * *")
              slot=late ;;
            *)
              echo "Unrecognized schedule [$EVENT_SCHEDULE] -- watcher will no-op" >&2
              slot=unknown ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "mode=live" >> "$GITHUB_OUTPUT"
          echo "force=" >> "$GITHUB_OUTPUT"
          echo "dispatched=" >> "$GITHUB_OUTPUT"
          if [ "$slot" = "parlay-early" ] || [ "$slot" = "parlay-final" ]; then
            echo "max_polls=1" >> "$GITHUB_OUTPUT"
            echo "max_runtime=240" >> "$GITHUB_OUTPUT"
          else
            echo "max_polls=" >> "$GITHUB_OUTPUT"
            echo "max_runtime=21000" >> "$GITHUB_OUTPUT"
          fi

      - name: Run watcher
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NBA_STATE_DIR: ${{ runner.temp }}/nba-state
          NBA_SLOT: ${{ steps.slot.outputs.slot }}
          NBA_MAX_RUNTIME_S: ${{ steps.slot.outputs.max_runtime }}
          NBA_MAX_POLLS: ${{ steps.slot.outputs.max_polls }}
          NBA_PARLAY_FORCE: ${{ steps.slot.outputs.force }}
          NBA_DISPATCHED: ${{ steps.slot.outputs.dispatched }}
          WATCH_MODE: ${{ steps.slot.outputs.mode }}
        run: |
          set -euo pipefail
          bash scripts/restore_state.sh
          bash scripts/state_sync_loop.sh &
          sync_pid=$!
          stop_sync() {
            kill "$sync_pid" 2>/dev/null || true
            wait "$sync_pid" 2>/dev/null || true
          }
          trap stop_sync EXIT
          args=()
          case "$WATCH_MODE" in
            dry-run) args+=(--dry-run) ;;
            check) args+=(--check) ;;
            simulate) args+=(--simulate) ;;
            live) ;;
            *) echo "unknown mode: $WATCH_MODE" >&2; exit 2 ;;
          esac
          set +e
          if [ "$NBA_SLOT" = "parlay-early" ] || [ "$NBA_SLOT" = "parlay-final" ]; then
            timeout 240 python -u watcher.py "${args[@]}"
          else
            python -u watcher.py "${args[@]}"
          fi
          code=$?
          set -e
          stop_sync
          trap - EXIT
          bash scripts/persist_state.sh
          exit "$code"
